name: Build and deploy

# Rebuilds the Statcast data and publishes web/ to GitHub Pages.
# - Daily during the season (12:00 UTC, after overnight Statcast processing), March through October.
# - On every push to main, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * 3-10 *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_refetch:
        description: "Ignore the cached raw data and re-download every season (~15 min)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw Savant downloads (~400 MB) are cached between runs, so a daily run only re-fetches
      # the last week of the current season. Each run saves a new cache entry; restore takes the newest.
      - name: Restore raw data
        if: ${{ !inputs.full_refetch }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}
          restore-keys: statcast-raw-

      - name: Fetch Statcast
        run: python pipeline/fetch_statcast.py --refresh-days 7

      - name: Save raw data
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}

      - name: Build site data
        run: python pipeline/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
