name: Build and deploy

# Rebuilds the Statcast data and publishes web/ to Cloudflare (static assets, see wrangler.jsonc).
# Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token template) and
# CLOUDFLARE_ACCOUNT_ID.
# - Daily during the season (12:00 UTC, after overnight Statcast processing), March through October.
# - On every push to main, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * 3-10 *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_refetch:
        description: "Ignore the cached raw data and re-download every season (~15 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw Savant downloads (~400 MB) are cached between runs, so a daily run only re-fetches
      # the last week of the current season. Each run saves a new cache entry; restore takes the newest.
      - name: Restore raw data
        if: ${{ !inputs.full_refetch }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}
          restore-keys: statcast-raw-

      - name: Fetch Statcast
        run: python pipeline/fetch_statcast.py --refresh-days 7

      - name: Save raw data
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}

      - name: Build site data
        run: python pipeline/build.py

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --message "$GITHUB_SHA"
